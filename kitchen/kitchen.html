<script>
// "Late-night kitchen" – vertical 9:16 cosy scene. Design space 1080x1920, rendered at 1440x2560.
const C=document.getElementById('c'); const X=C.getContext('2d'); const W=1080,H=1920, S=1440/1080;
function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const VP=[540,880]; const UW=0.66;               // vanishing point (eye level at the window)
function off(){const c=document.createElement('canvas');c.width=1440;c.height=2560;const q=c.getContext('2d');q.scale(S,S);return [c,q]}
function poly(q,pts,fill){q.beginPath();pts.forEach((p,i)=>i?q.lineTo(p[0],p[1]):q.moveTo(p[0],p[1]));q.closePath();q.fillStyle=fill;q.fill()}
// point on a line from a near point toward the vanishing point
const toVP=(p,u)=>[p[0]+(VP[0]-p[0])*u,p[1]+(VP[1]-p[1])*u];
function shade(hex,k){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;return `rgb(${Math.min(255,r*k|0)},${Math.min(255,g*k|0)},${Math.min(255,b*k|0)})`}

// ---------------- static room ----------------
let ROOM=null; const LIGHTS=[];
function buildRoom(){
 const [c,q]=off(); const r=rng(4);
 // back wall + window (far plane rectangle around VP)
 const bx0=540*UW,bx1=1080-540*UW,by0=880*UW,by1=1920-1040*UW;
 q.fillStyle='#2b2620';q.fillRect(0,0,W,H);
 // ceiling
 poly(q,[[0,0],[W,0],[bx1,by0],[bx0,by0]],'#1c1814');
 // back wall
 const bw=q.createLinearGradient(0,by0,0,by1);bw.addColorStop(0,'#5a4a3a');bw.addColorStop(1,'#3f342a');q.fillStyle=bw;q.fillRect(bx0,by0,bx1-bx0,by1-by0);
 // window (night city in rain)
 const wx0=378,wx1=702,wy0=650,wy1=960;
 const sky=q.createLinearGradient(0,wy0,0,wy1);sky.addColorStop(0,'#0b1430');sky.addColorStop(0.7,'#1b2a52');sky.addColorStop(1,'#2a3360');q.fillStyle=sky;q.fillRect(wx0,wy0,wx1-wx0,wy1-wy0);
 for(let i=0;i<70;i++){q.fillStyle='rgba(220,230,255,.6)';q.globalAlpha=0.3+r()*0.6;q.beginPath();q.arc(wx0+r()*(wx1-wx0),wy0+r()*120,r()*1.2+0.3,0,6.28);q.fill();}q.globalAlpha=1;
 // distant hills with city lights
 q.fillStyle='#121a33';q.beginPath();q.moveTo(wx0,wy1);for(let x=wx0;x<=wx1;x+=10)q.lineTo(x,wy1-60-Math.sin(x/40)*14-r()*10);q.lineTo(wx1,wy1);q.fill();
 for(let i=0;i<140;i++){const x=wx0+r()*(wx1-wx0),y=wy1-r()*70;q.fillStyle=['#ffd27a','#ffb35a','#fff1c0','#ff9a6a'][i%4];q.globalAlpha=0.5+r()*0.5;q.beginPath();q.arc(x,y,r()*1.8+0.6,0,6.28);q.fill();}q.globalAlpha=1;
 // window frame
 q.strokeStyle='#2a1f18';q.lineWidth=14;q.strokeRect(wx0,wy0,wx1-wx0,wy1-wy0);q.lineWidth=9;q.beginPath();q.moveTo((wx0+wx1)/2,wy0);q.lineTo((wx0+wx1)/2,wy1);q.moveTo(wx0,wy0+110);q.lineTo(wx1,wy0+110);q.stroke();
 q.fillStyle='#3a2b20';q.fillRect(wx0-20,wy1,wx1-wx0+40,18);
 // left wall
 poly(q,[[0,0],[bx0,by0],[bx0,by1],[0,H]],'#3a3128');
 // right wall
 poly(q,[[W,0],[bx1,by0],[bx1,by1],[W,H]],'#3d332a');
 // floor (wood planks converging)
 poly(q,[[0,H],[bx0,by1],[bx1,by1],[W,H]],'#5a3a24');
 for(let i=-16;i<=16;i++){const fx=540+i*80;q.strokeStyle='rgba(30,15,8,.55)';q.lineWidth=2;q.beginPath();q.moveTo(fx<0?0:fx>W?W:fx,H);q.lineTo(bx0+(bx1-bx0)*(0.5+i/36),by1);q.stroke();}
 for(let k=1;k<16;k++){const y=by1+(H-by1)*Math.pow(k/16,1.7);q.strokeStyle='rgba(30,15,8,.25)';q.lineWidth=1.2;for(let s=0;s<6;s++){const x=r()*W;q.beginPath();q.moveTo(x,y);q.lineTo(x+20,y);q.stroke();}}
 // rug in perspective
 const rug=[[250,1860],[420,1330],[660,1330],[830,1860]];poly(q,rug,'#7a3a2a');
 q.save();q.beginPath();rug.forEach((p,i)=>i?q.lineTo(p[0],p[1]):q.moveTo(p[0],p[1]));q.closePath();q.clip();
 for(let k=0;k<27;k++){const y=1330+k*16+k*k*0.15;const t=(y-1330)/530;const xl=420-170*t,xr=660+170*t;
  for(let j=0;j<11;j++){const x=xl+(xr-xl)*(j+0.5)/11;q.fillStyle=['#c96a3a','#e3a35a','#3a5a6a','#a8402e','#f0d2a0'][(k+j)%5];q.globalAlpha=0.7;q.beginPath();q.moveTo(x,y-6-t*4);q.lineTo(x+8+t*6,y);q.lineTo(x,y+6+t*4);q.lineTo(x-8-t*6,y);q.fill();}}
 q.globalAlpha=1;q.restore();q.strokeStyle='#e8c38a';q.lineWidth=5;q.beginPath();rug.forEach((p,i)=>i?q.lineTo(p[0],p[1]):q.moveTo(p[0],p[1]));q.closePath();q.stroke();
 // ---- left side: green cabinets, stove with pan, hood, fridge ----
 const green='#2f5a4a';
 // lower cabinets (box from near x=0 to far x=bx0)
 const lt0=[130,1270],lb0=[130,1680]; // near top/bottom front edge
 poly(q,[[0,1230],lt0,toVP(lt0,UW),toVP([0,1230],UW)],'#7a5034');poly(q,[lt0,toVP(lt0,UW),toVP([lt0[0],lt0[1]+16],UW),[lt0[0],lt0[1]+16]],'#5a3a24'); // counter top band
 poly(q,[lt0,toVP(lt0,UW),toVP(lb0,UW),lb0],green);
 for(let k=0;k<4;k++){const u0=k*UW/4,u1=u0+UW/4-0.03;const a=toVP(lt0,u0+0.02),b=toVP(lt0,u1),cc=toVP(lb0,u1),d=toVP(lb0,u0+0.02);poly(q,[[a[0],a[1]+30],[b[0],b[1]+24],[cc[0],cc[1]-10],[d[0],d[1]-14]],shade(green,1.15));
  q.fillStyle='#d8b070';q.fillRect(b[0]-14,(b[1]+cc[1])/2-14,4,28);}
 poly(q,[[0,1230],lt0,lb0,[0,1740]],shade(green,0.8));
 // stove + pan drawn IN the counter plane (perspective-correct)
 const CW=[0,1230], CF=lt0;
 const P=(u,a)=>{const w=toVP(CW,u),f=toVP(CF,u);return [w[0]+(f[0]-w[0])*a, w[1]+(f[1]-w[1])*a];};
 const plane=(u,a,fn)=>{const o=P(u,a),ax=P(u,a+0.1),ay=P(u+0.02,a);q.save();q.transform((ax[0]-o[0])/10,(ax[1]-o[1])/10,(ay[0]-o[0])/10,(ay[1]-o[1])/10,o[0],o[1]);fn();q.restore();};
 // stovetop (dark glass with steel trim)
 poly(q,[P(0.14,0.1),P(0.42,0.1),P(0.42,0.92),P(0.14,0.92)],'#8a8f96');
 poly(q,[P(0.15,0.14),P(0.41,0.14),P(0.41,0.88),P(0.15,0.88)],'#1b1b20');
 // burners + pan, drawn as ellipses lying in the counter plane
 const e0=P(0.2,0.5),e1=P(0.4,0.5);const ang=Math.atan2(e1[1]-e0[1],e1[0]-e0[0]);
 const ell=(c,rx,ry,fill,stroke,lw)=>{q.beginPath();q.ellipse(c[0],c[1],rx,ry,ang,0,6.28);if(fill){q.fillStyle=fill;q.fill();}if(stroke){q.strokeStyle=stroke;q.lineWidth=lw||2;q.stroke();}};
 [P(0.21,0.3),P(0.21,0.72),P(0.36,0.3)].forEach(c=>{ell(c,34,11,null,'#3a3a42',2.5);ell(c,18,6,null,'#3a3a42',2);});
 const PC=P(0.33,0.62);
 ell(PC,44,14,null,'rgba(90,150,255,.9)',2.5);
 // pan base sits on the burner; wall rises 18px; food inside; rim highlight
 const top=[PC[0],PC[1]-18];
 ell(PC,74,24,'#141418');
 q.fillStyle='#1d1d22';q.beginPath();q.ellipse(PC[0],PC[1],74,24,ang,0,Math.PI);q.lineTo(top[0]+Math.cos(ang+Math.PI)*74,top[1]+Math.sin(ang+Math.PI)*74);q.ellipse(top[0],top[1],74,24,ang,Math.PI,0,true);q.closePath();q.fill();
 ell(top,74,24,'#2a2a30');ell(top,64,19,'#3d5a2c');
 const rr=rng(31);for(let k=0;k<34;k++){const a=rr()*6.28,d=Math.sqrt(rr());const lx=Math.cos(a)*60*d,ly=Math.sin(a)*16*d;
  const px=top[0]+lx*Math.cos(ang)-ly*Math.sin(ang),py=top[1]+lx*Math.sin(ang)+ly*Math.cos(ang);q.fillStyle=['#7aa548','#c94a3a','#f0c060','#5d8a3a','#efe6c8'][k%5];q.beginPath();q.ellipse(px,py,7,4,rr()*3,0,6.28);q.fill();}
 ell(top,74,24,null,'#5a5a62',2);
 // handle out toward the front edge
 const hd=P(0.31,1.08);q.strokeStyle='#18181c';q.lineWidth=12;q.lineCap='round';q.beginPath();q.moveTo(top[0]+50,top[1]+14);q.lineTo(hd[0],hd[1]-12);q.stroke();
 window.PAN=[top[0],top[1]-10];
 // range hood + upper cabinets
 poly(q,[[0,430],[260,520],[250,680],[0,640]],'#8a8f96');poly(q,[[0,640],[250,680],[240,700],[0,670]],'#6a6f76');
 poly(q,[[0,250],toVP([0,250],UW),toVP([0,560],UW),[0,560]],shade(green,0.85));
 for(let k=0;k<4;k++){const u0=0.26+k*0.1,u1=u0+0.085;const a=toVP([0,250],u0),b=toVP([0,250],u1),cc=toVP([0,560],u1),d=toVP([0,560],u0);poly(q,[[a[0],a[1]+8],[b[0],b[1]+6],[cc[0],cc[1]-6],[d[0],d[1]-8]],shade(green,1.05));}
 // fridge (near left, retro mint) with magnets/photos
 poly(q,[[0,600],[100,660],[100,1760],[0,1840]],'#7fb8a0');poly(q,[[0,600],[100,660],[100,680],[0,630]],'#a8d8c0');
