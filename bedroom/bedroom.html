function rng(seed){let s=(seed*2654435761)>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296}}
const lerp=(a,b,u)=>a+(b-a)*u, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), ease=u=>u<0?0:u>1?1:u*u*(3-2*u);
function poly(q,pts){q.beginPath();pts.forEach((p,i)=>i?q.lineTo(p[0],p[1]):q.moveTo(p[0],p[1]));q.closePath();}
function shape(q,pts,base,shadow,light){
 const L=[],R=[];
 for(let i=0;i<pts.length;i++){const p=pts[i],a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];
  const dx=b[0]-a[0],dy=b[1]-a[1],len=Math.hypot(dx,dy)||1,nx=-dy/len,ny=dx/len;L.push([p[0]+nx*p[2],p[1]+ny*p[2]]);R.push([p[0]-nx*p[2],p[1]-ny*p[2]]);}
 const path=new Path2D();path.moveTo(L[0][0],L[0][1]);
 for(let i=1;i<L.length;i++){const m=[(L[i-1][0]+L[i][0])/2,(L[i-1][1]+L[i][1])/2];path.quadraticCurveTo(L[i-1][0],L[i-1][1],m[0],m[1]);}
 const e=pts[pts.length-1];path.lineTo(L[L.length-1][0],L[L.length-1][1]);path.quadraticCurveTo(e[0]+(e[0]-pts[pts.length-2][0])*0.3,e[1]+(e[1]-pts[pts.length-2][1])*0.3,R[R.length-1][0],R[R.length-1][1]);
 for(let i=R.length-2;i>=0;i--){const m=[(R[i+1][0]+R[i][0])/2,(R[i+1][1]+R[i][1])/2];path.quadraticCurveTo(R[i+1][0],R[i+1][1],m[0],m[1]);}

 const s0=pts[0],s1=pts[pts.length-1],dx=s1[0]-s0[0],dy=s1[1]-s0[1],len=Math.hypot(dx,dy),nx=-dy/len,ny=dx/len,mx=(s0[0]+s1[0])/2,my=(s0[1]+s1[1])/2,wmax=Math.max(...pts.map(p=>p[2]));
 const g=q.createLinearGradient(mx+nx*wmax,my+ny*wmax,mx-nx*wmax,my-ny*wmax);g.addColorStop(0,shadow);g.addColorStop(0.35,base);g.addColorStop(0.6,light||base);g.addColorStop(1,shadow);
 q.fillStyle=g;q.fill(path);return path;}

 // window: night city through rain

 q.save();q.beginPath();q.rect(WIN.x0,WIN.y0,WIN.x1-WIN.x0,WIN.y1-WIN.y0);q.clip();
 const mg=q.createRadialGradient(780,470,5,780,470,160);mg.addColorStop(0,'rgba(220,230,255,.55)');mg.addColorStop(0.2,'rgba(200,215,255,.18)');mg.addColorStop(1,'rgba(200,215,255,0)');q.fillStyle=mg;q.fillRect(WIN.x0,WIN.y0,400,520);
 q.filter='blur(1px)';q.fillStyle='#f3f1ea';q.beginPath();q.arc(780,470,22,0,6.28);q.fill();q.filter='none';
 for(let i=0;i<9;i++){const bx=WIN.x0+i*44-10,bw=30+r()*30,bh=120+r()*180;q.fillStyle='#121a30';q.fillRect(bx,WIN.y1-bh,bw,bh);for(let k=0;k<16;k++){if(r()<0.45){q.fillStyle=r()<0.7?'rgba(255,200,120,.75)':'rgba(180,210,255,.6)';q.fillRect(bx+4+((k*7)%Math.max(8,bw-8)),WIN.y1-bh+8+((k*13)%Math.max(10,bh-16)),4,5);}}}
 q.filter='blur(14px)';for(let i=0;i<18;i++){q.fillStyle=['rgba(255,170,90,.45)','rgba(255,120,120,.35)','rgba(150,190,255,.4)'][i%3];q.beginPath();q.arc(WIN.x0+r()*370,WIN.y0+300+r()*220,8+r()*16,0,6.28);q.fill();}q.filter='none';
 q.restore();
 // sheer curtains
 for(const [x0,x1] of [[WIN.x0-40,WIN.x0+70],[WIN.x1-60,WIN.x1+40]]){const g=q.createLinearGradient(x0,0,x1,0);g.addColorStop(0,'rgba(235,225,235,.10)');g.addColorStop(0.5,'rgba(235,225,235,.24)');g.addColorStop(1,'rgba(235,225,235,.10)');q.fillStyle=g;q.fillRect(x0,WIN.y0-30,x1-x0,WIN.y1-WIN.y0+90);
  q.strokeStyle='rgba(255,255,255,.07)';q.lineWidth=6;for(let x=x0+8;x<x1;x+=18){q.beginPath();q.moveTo(x,WIN.y0-30);q.quadraticCurveTo(x+6,WIN.y0+260,x-2,WIN.y1+60);q.stroke();}}

 const ml=q.createLinearGradient(640,800,300,1150);ml.addColorStop(0,'rgba(170,190,255,.10)');ml.addColorStop(1,'rgba(170,190,255,0)');q.fillStyle=ml;poly(q,[[640,780],[1010,780],[760,1180],[300,1180]]);q.fill();
 // floating shelf: clock, little plant, framed photo of them, candle
 q.save();q.translate(110,0);q.fillStyle='#3a2a26';q.fillRect(70,800,360,16);q.fillStyle='rgba(0,0,0,.35)';q.fillRect(70,816,360,10);

 q.fillStyle='#4a3a34';q.fillRect(250,700,74,100);q.fillStyle='#d9cfc2';q.fillRect(256,706,62,88);

// ---------- timeline ----------
const BLINKS=[2.6,5.1,10.7,15.6];
function lidAt(t){let l=0.40+0.05*Math.sin(t*1.3);
 if(t>6.3&&t<8.55)l=lerp(l,1,ease((t-6.3)/0.9));            // drifting off
 if(t>=8.55&&t<8.75)l=lerp(1,0.22,ease((t-8.55)/0.2));        // catches herself
 if(t>=8.75&&t<12.6)l=lerp(0.22,0.40,ease((t-8.75)/2));
 if(t>=12.6)l=lerp(0.40,0.12,ease((t-12.6)/0.4));             // the call: eyes light up
 for(const b of BLINKS){const d=t-b;if(d>0&&d<0.42)l=Math.max(l,Math.sin(d/0.42*Math.PI));}
 return clamp(l,0,1);}
const sinkAt=t=>(t>6.3&&t<8.55?ease((t-6.3)/1.2):0)*1-(t>=8.55&&t<8.9?Math.sin((t-8.55)/0.35*Math.PI)*0.5:0);
const smileAt=t=>ease((t-12.9)/0.9);
function phoneState(t){if(t<8.6)return 0;if(t<12.5)return 1;return 2;}
